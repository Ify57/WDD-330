<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/checkout.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <section class="checkout">
        <h2>Checkout</h2>

        <div class="checkout-layout">
          <form id="checkout-form" name="checkout">
            <fieldset>
              <legend>Customer Information</legend>

              <label for="fname">First Name</label>
              <input
                type="text"
                id="fname"
                name="fname"
                autocomplete="given-name"
                minlength="2"
                maxlength="50"
                required
              />

              <label for="lname">Last Name</label>
              <input
                type="text"
                id="lname"
                name="lname"
                autocomplete="family-name"
                minlength="2"
                maxlength="50"
                required
              />
            </fieldset>

            <fieldset>
              <legend>Billing and Shipping Address</legend>

              <label for="street">Street Address</label>
              <input
                type="text"
                id="street"
                name="street"
                autocomplete="street-address"
                maxlength="100"
                required
              />

              <label for="city">City</label>
              <input
                type="text"
                id="city"
                name="city"
                autocomplete="address-level2"
                maxlength="50"
                required
              />

              <label for="state">State</label>
              <input
                type="text"
                id="state"
                name="state"
                autocomplete="address-level1"
                maxlength="50"
                required
              />

              <label for="zip">Zip Code</label>
              <input
                type="text"
                id="zip"
                name="zip"
                inputmode="numeric"
                autocomplete="postal-code"
                pattern="([0-9]{5}(-[0-9]{4})?|[0-9]{6})"
                maxlength="10"
                title="Enter a 5-digit US ZIP code, a ZIP+4 code, or a 6-digit Nigerian postal code."
                required
              />
            </fieldset>

            <fieldset>
              <legend>Payment Information</legend>

              <label for="cardNumber">Credit Card Number</label>
              <input
                type="text"
                id="cardNumber"
                name="cardNumber"
                inputmode="numeric"
                autocomplete="cc-number"
                pattern="[0-9]{13,16}"
                minlength="13"
                maxlength="16"
                title="Enter a card number containing 13 to 16 digits."
                required
              />

              <label for="expiration">Expiration Date</label>
              <input
                type="text"
                id="expiration"
                name="expiration"
                placeholder="MM/YY"
                autocomplete="cc-exp"
                pattern="(0[1-9]|1[0-2])/[0-9]{2}"
                maxlength="5"
                title="Enter the expiration date in MM/YY format."
                required
              />

              <label for="code">Security Code</label>
              <input
                type="text"
                id="code"
                name="code"
                inputmode="numeric"
                autocomplete="cc-csc"
                pattern="[0-9]{3,4}"
                minlength="3"
                maxlength="4"
                title="Enter a three- or four-digit security code."
                required
              />
            </fieldset>

            <button type="submit">Place Order</button>
          </form>

          <section id="order-summary">
            <h3>Order Summary</h3>

            <p>
              Subtotal:
              <span id="subtotal">$0.00</span>
              (<span id="item-count">0</span> items)
            </p>

            <p>
              Tax:
              <span id="tax">$0.00</span>
            </p>

            <p>
              Shipping:
              <span id="shipping">$0.00</span>
            </p>

            <hr />

            <p>
              <strong>Order Total:</strong>
              <strong id="order-total">$0.00</strong>
            </p>
          </section>
        </div>
      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
