<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Sleep Outside | Checkout</title>

  <link rel="stylesheet" href="/css/style.css" />
</head>

<body>
  <header class="divider" id="main-header"></header>
  <script src="/js/checkout.js" type="module"></script>

  <main class="divider">
    <section class="summary">
      <h2>Order Summary</h2>
      <div class="summaryInfo">
        <p>Subtotal </p>
        <p id="subtotal">$</p>
        <p id="tax">Tax </p>
        <p id="tax">$</p>
        <p>Estimated Shipping</p>
        <p id="shipping">$</p>
      </div>
      <div class="orderTotal">
        <p>Total</p>
        <p id="orderTotal">$</p>
      </div>
    </section>
    <section class="checkout">

      <form method="get" action="order-summary.html" id="checkoutForm" class="checkoutForm">
        <h2>Place Your Order</h2>
        <fieldset>
          <legend>Enter Your Name:</legend>
          <label for="first">First Name: </label>
          <input type="text" name="first" id="first" required>
          <label for="last">Last Name: </label>
          <input type="text" name="last" id="last" required>
        </fieldset>
        <fieldset>
          <legend>Enter Your Address: </legend>
          <label for="street">Street Address: </label>
          <input type="text" name="street" id="street" required>
          <label for="city">City: </label>
          <input type="text" name="city" id="city" required>
          <label for="state">State: </label>
          <input type="text" name="state" id="state" required>
          <label for="zip">Zip Code: </label>
          <input type="text" name="zip" id="zip" required>
        </fieldset>
        <fieldset>
          <legend>Enter Your Credit Card Information</legend>
          <label for="cardNum">Credit Card Number: </label>
          <input type="text" name="cardNum" id="cardNum" required>
          <label for="exDate">Expiration Date: </label>
          <input type="text" name="exDate" id="exDate" placeholder="mm/yy" required>
          <label for="securityCode">Security Code: </label>
          <input type="text" name="securityCode" id="securityCode" required>
        </fieldset>
        <input type="submit" value="Place Order">
      </form>
    </section>
  </main>

  <footer id="main-footer"></footer>
</body>

</html>
