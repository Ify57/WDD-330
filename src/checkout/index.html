<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Sleep Outside | Checkout</title>
  <script src="/js/checkout.js" type="module"></script>
  <link rel="stylesheet" href="/css/style.css" />
</head>

<body>
  <header class="divider" id="main-header"></header>

  <span>Remove Testing Values</span>
  <main class="divider checkout">
    <h2>Review &amp; Place Your Order</h2>
    <section class="checkout-form">
      <form name="checkout">
        <input type="hidden" name="orderDate" id="orderDate">

        <fieldset>
          <div class="checkout__name">
            <label for="fname">First Name</label>
            <input type="text" name="fname" id="fname" value="First" required>
            <label for="lname">Last Name</label>
            <input type="text" name="lname" id="lname" value="Last" required>
          </div>
          <div class="checkout__address">
            <label for="street">Street Address</label>
            <input type="text" name="street" id="street" value="123 Main Street" required>
            <label for="city">City</label>
            <input type="text" name="city" id="city" value="Provo" required>
            <label for="state">State</label>
            <input type="text" name="state" id="state" value="Utah" required>
            <label for="zip">Zip</label>
            <input type="text" name="zip" id="zip" value="84601" required>
          </div>
        </fieldset>
        <fieldset>
          <legend>Payment</legend>
          <div class="checkout__payment">
            <label for="cardNumber">Card Number</label>
            <input type="text" name="cardNumber" id="cardNumber" value="1234123412341234" required>
            <label for="expiration">Expiration</label>
            <input type="text" name="expiration" id="expiration" value="11/28" required>
            <label for="code">CVV</label>
            <input type="text" name="code" id="code" value="123" required>
          </div>
        </fieldset>
        <fieldset class="checkout-summary">
          <legend>Order Summary</legend>
          <ul>
            <li><label for="cartTotal">Item Subtotal (<span id="num-items">0</span>)</span></label>
              <p id="cartTotal"></p>
            </li>
            <li><label for="shipping">Shipping Estimate</label>
              <p id="shipping" name="shipping"></p>
            </li>
            <li><label for="tax">Tax</label>
              <p id="tax"></p>
            </li>
            <li><label for="orderTotal"><b>Order Total</b></label>
              <p id="orderTotal"></p>
            </li>
          </ul>
          <!--
                    <div>Items</div>
          <div id="num-items"></div>
          <div>Subtotal</div>
          <div id="cartTotal"></div>
          <div>Tax</div>
          <div id="tax"></div>
          <div>Shipping</div>
          <div id="shipping"></div>
          <div>Total</div>
          <div id="orderTotal"></div>
          -->

        </fieldset>
        <button type="submit" id="checkoutSubmit">Checkout</button>
      </form>
    </section>
  </main>

  <footer id="main-footer"></footer>
</body>

</html>
